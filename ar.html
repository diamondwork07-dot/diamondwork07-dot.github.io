<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR.js GLB Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- AR.js สำหรับ A-Frame (marker-based AR) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .arjs-loader div {
      text-align: center;
      font-size: 1.25em;
      color: white;
    }
  </style>
</head>
<body>

  <div class="arjs-loader">
    <div>กำลังโหลด AR... กรุณาอนุญาตการใช้กล้อง</div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Marker แบบ Hiro (มาตรฐานของ AR.js) -->
    <a-marker preset="hiro">
      <!-- เปลี่ยน src ตรงนี้เป็น URL ของไฟล์ model.glb ของคุณ -->
      <a-entity
        gltf-model="url(model.glb)"
        scale="0.05 0.05 0.05"
        position="0 0 0"
        rotation="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    window.addEventListener('load', function () {
      var loader = document.querySelector('.arjs-loader');
      var scene = document.querySelector('a-scene');
      scene.addEventListener('renderstart', function () {
        loader.style.display = 'none';
      });
    });
  </script>

</body>
</html>
