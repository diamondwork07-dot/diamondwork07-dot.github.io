<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR.js Marker Demo</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- AR.js (marker based build) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .arjs-loader div {
      text-align: center;
      font-size: 1.25em;
      color: white;
    }
  </style>
</head>

<body>
  <div class="arjs-loader">
    <div>กำลังโหลด...</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  >

    <a-assets>
      <!--
        ===== ใส่ GLB โมเดลของคุณตรงนี้ =====
        1) แก้ path "model.glb" ให้เป็นไฟล์ .glb ของคุณ
           (วางไฟล์ไว้โฟลเดอร์เดียวกับ ar.html หรือใส่เป็น URL เต็มก็ได้)
      -->
      <a-asset-item id="model" src="TankModel AR.glb"></a-asset-item>
    </a-assets>

    <!--
      ===== Marker =====
      ใช้ marker แบบ pattern จากภาพ tracker.png ที่ให้มา
      AR.js ต้องการไฟล์ .patt (ไม่ใช่ .png) สำหรับ tracking จริง ๆ
      ด้านล่างนี้ผมตั้งค่า url ไปที่ "tracker.patt" (path เดียวกับ tracker.png)
      ซึ่งเป็นชื่อไฟล์ที่คอร์สส่วนใหญ่แบบนี้ใช้คู่กัน

      ถ้าโหลดแล้ว marker ไม่ทำงาน (ไม่เจอไฟล์ .patt) ให้ทำอย่างใดอย่างหนึ่ง:
      a) เอาไฟล์ tracker.png ไปสร้าง .patt เองที่ https://ar-js-org.github.io/AR.js/three.js/examples/marker-training/examples/generator.html
         แล้วอัปโหลดไฟล์ .patt ที่ได้ไว้ข้าง ๆ ar.html แล้วเปลี่ยน url="./tracker.patt"
      b) หรือถ้ามี .patt โฮสต์อยู่แล้วที่อื่น ให้ใส่ URL เต็มแทน
    -->
    <a-marker
      type="pattern"
      url="https://aitutorialcourse.github.io/tracker.patt"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;"
    >
      <!-- โมเดล GLB จะมาโผล่ตรงนี้เมื่อกล้องเจอ marker -->
      <a-entity
        gltf-model="#model"
        scale="0.05 0.05 0.05"
        position="0 0 0"
        rotation="0 0 0"
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ซ่อน loader เมื่อ A-Frame โหลดฉากเสร็จ
    document.querySelector('a-scene').addEventListener('loaded', function () {
      document.querySelector('.arjs-loader').style.display = 'none';
    });
  </script>
</body>
</html>
