<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR.js - GLB Model Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- AR.js สำหรับ A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    .arjs-loader {
      height: 100%; width: 100%;
      position: fixed; top: 0; left: 0;
      background-color: rgba(0,0,0,0.8);
      z-index: 9999; display:flex; justify-content:center; align-items:center;
    }
    .arjs-loader div {
      color: white; font-size: 1.25em; text-align:center;
    }
  </style>
</head>
<body style="margin:0; overflow:hidden;">

  <div class="arjs-loader">
    <div>กำลังโหลด AR...</div>
  </div>

  <!--
    sourceType: webcam  -> ใช้กล้องมือถือ/คอม
    debugUIEnabled: false -> ปิด UI debug ของ AR.js
  -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-assets>
      <!-- เปลี่ยน path ให้ตรงกับตำแหน่งไฟล์ .glb ของคุณจริง -->
      <a-asset-item src="TankModel AR.glb"></a-asset-item>
    </a-assets>

    <!--
      Marker แบบ pattern (custom marker)
      ต้องมีไฟล์ tracker.patt ที่สร้างจากภาพ tracker.png ผ่านตัว generator ของ AR.js
      https://ar-js-org.github.io/AR.js/three.js/examples/marker-training/examples/generator.html
    -->
    <a-marker type="pattern" url="tracker.patt">
      <a-entity
        gltf-model="#myModel"
        scale="0.05 0.05 0.05"
        position="0 0 0"
        rotation="0 0 0">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    window.addEventListener('load', () => {
      const loader = document.querySelector('.arjs-loader');
      if (loader) setTimeout(() => loader.style.display = 'none', 1500);
    });
  </script>

</body>
</html>
